allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  bun: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Auth.js beta still declares Nodemailer <=8, but that line is affected by
# GHSA-p6gq-j5cr-w38f. Keep the audited 9.x release; our SMTP integration uses
# the stable createTransport/verify/sendMail surface and has a real TCP test.
peerDependencyRules:
  allowedVersions:
    nodemailer: 9.1.1

overrides:
  'sharp@^0.34.3': 0.35.4
  'sharp@^0.33.5': 0.35.4
